<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
   <fieldset>
    <legend>Personal Details</legend>

    <form action="https://www.10000coders.in/">
    <label>Name:</label>
    <input type="text" required>
    <br> 
   </br>
   <label>Surname:</label>
    <input type="text" required>
    <br> 
   </br>
   
   <label>Email:</label>
   <input type="text"required id=""name>
   <br> 
   </br>
   <label>MobileNumber:</label>
   <input type="text"required id=""Number>
   <br> 
   </br>
   <label>Password:</label>
   <input type="text"required id=""Password>
   <br> 
   </br>
   <label>ConfirmPassword:</label>
   <input type="text"required id=""Password>
   <br> 
</br>
   <label>Date of Birth:</label>
   <input type="text"placeholder="dd-mm-yyyy">
   <br> 
   </br>
   <label for="">Gender:</label>
   
<label for="male">Male</label>
<input type="radio" id="male" name="gender">

<label for="female">FeMale</label>
<input type="radio" id="female"name="gender">

<label for="other">others</label>
<input type="radio" id="others"name="gender">
<br>
</br>
<label for="country">Select Country:</label>      
<input type="text" list="countries">
<datalist id="countries">
    <option value="India">
    <option value="USA">
    <option value="UK">
    <option value="Australia">
    <option value="Canada">
</datalist>      
   </option> 
   <br>
   </br>
<label for="year">year of graduation</label>
<input id="year"list="years">
<datalist id="years">   
    <option value="2025">
    <option value="2026">
    <option value="2027">
    <option value="2028">
</datalist>
<br>
</br>
   <label>Upload Picture:</label>
    <input type="file">
    <br><br>

    <input type="reset">
 </fieldset>
 <fieldset>
    <legend>Cource Details</legend>
    <label>Select Course:</label>

<select>
    <option value="">--Select Course--</option>
    <option value="python">Python Full Stack</option>
    <option value="java">Java Full Stack</option>
    <option value="data science">Data Science</option>
    <option value="web development">Web Development</option>
    <option value="testing">Software Testing</option>
</select>
<br><br>
   <lable for="">Delivery Mode:</lable>
   
   
<label for="Online">Online</label>
<input type="radio" id="male" name="Delivery Mode">

<label for="Offline">Offline</label>
<input type="radio" id="female"name="Delivery Mode">
<br>
</br>
     <label>Comments:</label>
<br>
<textarea rows="5" cols="50"></textarea>
<br><br>
     
      </fieldset>
   </form>

</html>
